services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compute-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html/
    depends_on:
      - python
      - db

  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: compute-python
    ports:
      - "5003:5000"
    env_file:
      - .env

  db:
    image: mysql:5.7
    container_name: compute-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: accounts
      MYSQL_USER: abul
      MYSQL_PASSWORD: changeme
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: