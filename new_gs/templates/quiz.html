<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .question-container {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Quiz on {{ topic }}</h1>

    <form method="POST" action="/submit_answers" id="quiz-form">
        <input type="hidden" id="questionsData" name="questions" value='{{ questions | tojson | safe }}'>

        {% for index, question in enumerate(questions) %}
            <div class="question-container">
                <p>Q{{ index + 1 }}: {{ question.question_text }}</p>

                {% if question.options %}
                    {% for option in question.options %}
                        <input type="radio" name="answer_{{ index }}" value="{{ option }}"> {{ option }}<br>
                    {% endfor %}
                {% else %}
                    <textarea name="answer_{{ index }}"></textarea>
                {% endif %}
            </div>
        {% endfor %}

        <input type="submit" value="Submit">
    </form>

    <script>
        // Prevent submission if not all questions are answered
        document.getElementById("quiz-form").addEventListener("submit", function(event) {
            let questions = document.querySelectorAll(".question-container");
            let allAnswered = true;

            questions.forEach((question) => {
                let radioInputs = question.querySelectorAll("input[type='radio']");
                let textarea = question.querySelector("textarea");

                if (radioInputs.length > 0) {
                    let checked = Array.from(radioInputs).some(input => input.checked);
                    if (!checked) {
                        allAnswered = false;
                    }
                }

                if (textarea && textarea.value.trim() === "") {
                    allAnswered = false;
                }
            });

            if (!allAnswered) {
                event.preventDefault();
                alert("Please answer all questions before submitting.");
            }
        });
    </script>

</body>
</html>
