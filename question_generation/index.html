<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="navstyle.css">
    <title>Quiz Generator</title>

    <style>
        body {
            background: url('background.jpg') no-repeat;
            background-position: center;
            background-size: cover;
        }

        main {
            margin: 50px auto;
            width: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px);
        }

        .center-box {
            padding: 20px;
            width: 80%;
            max-width: 500px;
            background-color: #fff;
            border: 2px solid #ccc;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            background: rgba(228, 218, 218, 0.7);
            backdrop-filter: blur(5px);
        }

        .center-box h1,
        .center-box h2 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
            text-align: center;
        }

        .center-box button {
            width: 80%;
            padding: 10px;
            margin: 5px 0;
            font-size: 12px;
            color: #fff;
            background-color: #2e2f30;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .center-box button:hover {
            background-color: #5b6e6d;
        }

        .topic-buttons,
        .num-questions-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-top: 10px;
        }

        .selected {
            background-color: #4CAF50 !important;
            border: 2px solid #2e2f30;
        }
    </style>
</head>
<body>
    <nav>
        <input type="checkbox" id="check">

        <label for="check" class="checkbtn">
            <i class="fas fa-bars"></i>
        </label>

        <div class="logo">
            <a href="../home.php">Compute Companion</a>
        </div>

        <ul>
            <li><a href="../aboutus.html">About Us</a></li>
            <li><a href="#">Messages</a></li>
            <li class="dropdown">
                <a href="#">Account</a>
                <ul class="dropdown-content">
                    <li><a href="#">Profile</a></li>
                    <li><a href="#">Settings</a></li>
                    <li><a href="../logout.php">Logout</a></li>
                </ul>
            </li>
        </ul>
    </nav>

    <main>
        <div class="center-box">
            <h1>Select Quiz Options</h1>

            <form action="/question_generation/proxy.php" method="POST" onsubmit="return validateQuizForm()">
                <div class="topic-buttons">
                    <h2>Select Topic:</h2>

                    <button type="button" onclick="selectTopic('Structure and Function of the Processor', this)">1.1.1. Structure and Function of the Processor</button>
                    <button type="button" onclick="selectTopic('Types of Processor', this)">1.1.2. Types of Processor</button>
                    <button type="button" onclick="selectTopic('Input, Output and Storage', this)">1.1.3. Input, Output and Storage</button>
                    <button type="button" onclick="selectTopic('Systems Software', this)">1.2.1. Systems Software</button>
                    <button type="button" onclick="selectTopic('Applications Generation', this)">1.2.2. Applications Generation</button>
                    <button type="button" onclick="selectTopic('Software Development', this)">1.2.3. Software Development</button>
                    <button type="button" onclick="selectTopic('Types of Programming Language', this)">1.2.4. Types of Programming Language</button>
                    <button type="button" onclick="selectTopic('Compression, Encryption and Hashing', this)">1.3.1. Compression, Encryption and Hashing</button>
                    <button type="button" onclick="selectTopic('Databases', this)">1.3.2. Databases</button>
                    <button type="button" onclick="selectTopic('Networks', this)">1.3.3. Networks</button>
                    <button type="button" onclick="selectTopic('Web Technologies', this)">1.3.4. Web Technologies</button>
                    <button type="button" onclick="selectTopic('Data Types', this)">1.4.1. Data Types</button>
                    <button type="button" onclick="selectTopic('Data Structures', this)">1.4.2. Data Structures</button>
                    <button type="button" onclick="selectTopic('Boolean Algebra', this)">1.4.3. Boolean Algebra</button>
                    <button type="button" onclick="selectTopic('Computing Related Legislation', this)">1.5.1. Computing Related Legislation</button>
                    <button type="button" onclick="selectTopic('Moral and Ethical Issues', this)">1.5.2. Moral and Ethical Issues</button>
                    <button type="button" onclick="selectTopic('Thinking Abstractly', this)">2.1.1. Thinking Abstractly</button>
                    <button type="button" onclick="selectTopic('Thinking Ahead', this)">2.1.2. Thinking Ahead</button>
                    <button type="button" onclick="selectTopic('Thinking Procedurally', this)">2.1.3. Thinking Procedurally</button>
                    <button type="button" onclick="selectTopic('Thinking Logically', this)">2.1.4. Thinking Logically</button>
                    <button type="button" onclick="selectTopic('Thinking Concurrently', this)">2.1.5. Thinking Concurrently</button>
                    <button type="button" onclick="selectTopic('Programming Techniques', this)">2.2.1. Programming Techniques</button>
                    <button type="button" onclick="selectTopic('Computational Methods', this)">2.2.2. Computational Methods</button>
                    <button type="button" onclick="selectTopic('Analysis, Design and Comparison of Algorithms', this)">2.3.1. Analysis, Design and Comparison of Algorithms</button>
                    <button type="button" onclick="selectTopic('Algorithms for the Main Data Structures', this)">2.3.2. Algorithms for the Main Data Structures</button>
                    <button type="button" onclick="selectTopic('Sorting Algorithms', this)">2.3.3. Sorting Algorithms</button>
                    <button type="button" onclick="selectTopic('Searching Algorithms', this)">2.3.4. Searching Algorithms</button>
                    <button type="button" onclick="selectTopic('Path Finding Algorithms', this)">2.3.5. Path Finding Algorithms</button>
                </div>

                <div class="num-questions-buttons">
                    <h2>Select Number of Questions:</h2>

                    <button type="button" onclick="selectNumQuestions(5, this)">5 Questions</button>
                    <button type="button" onclick="selectNumQuestions(10, this)">10 Questions</button>
                    <button type="button" onclick="selectNumQuestions(15, this)">15 Questions</button>
                    <button type="button" onclick="selectNumQuestions(20, this)">20 Questions</button>
                </div>

                <input type="hidden" name="topic" id="selectedTopic">
                <input type="hidden" name="num_questions" id="selectedNumQuestions">
                <input type="hidden" name="level" value="A-Level">

                <button type="submit">Generate Quiz</button>
            </form>
        </div>
    </main>

    <script>
        function selectTopic(topic, button) {
            let buttons = document.querySelectorAll('.topic-buttons button');
            buttons.forEach(btn => btn.classList.remove('selected'));
            button.classList.add('selected');
            document.getElementById('selectedTopic').value = topic;
        }

        function selectNumQuestions(num, button) {
            let buttons = document.querySelectorAll('.num-questions-buttons button');
            buttons.forEach(btn => btn.classList.remove('selected'));
            button.classList.add('selected');
            document.getElementById('selectedNumQuestions').value = num;
        }

        function validateQuizForm() {
            const topic = document.getElementById('selectedTopic').value;
            const numQuestions = document.getElementById('selectedNumQuestions').value;

            if (!topic) {
                alert('Please select a topic.');
                return false;
            }

            if (!numQuestions) {
                alert('Please select the number of questions.');
                return false;
            }

            return true;
        }
    </script>
</body>
</html>
