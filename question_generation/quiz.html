<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .question-container {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        .question-container p {
            margin-bottom: 10px;
            font-weight: bold;
        }

        .option-label {
            display: block;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .submit-btn {
            padding: 10px 18px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Generated Quiz</h1>

    <form method="POST" action="/question_generation/proxy.php/result" id="quiz-form">
        <div id="quiz-container"></div>
        <input type="submit" value="Submit Answers" class="submit-btn">
    </form>

    <script>
        const rawQuestions = `{{ questions | safe }}`;
        const quizContainer = document.getElementById("quiz-container");
        const form = document.getElementById("quiz-form");

        function parseQuestions(raw) {
            const lines = raw
                .split(/<br\s*\/?>/i)
                .map(line => line.trim())
                .filter(line => line !== "");

            const questions = [];
            let currentQuestion = null;

            for (const line of lines) {
                if (/^Question\s+\d+:/i.test(line)) {
                    if (currentQuestion) {
                        questions.push(currentQuestion);
                    }

                    currentQuestion = {
                        question_text: line,
                        options: [],
                        answer_hash: ""
                    };
                } else if (/^[A-D]\.\s*/.test(line)) {
                    if (currentQuestion) {
                        currentQuestion.options.push(line);
                    }
                } else if (/^[a-f0-9]{64}$/i.test(line)) {
                    if (currentQuestion) {
                        currentQuestion.answer_hash = line;
                    }
                }
            }

            if (currentQuestion) {
                questions.push(currentQuestion);
            }

            return questions;
        }

        function renderQuiz() {
            const questions = parseQuestions(rawQuestions);

            if (questions.length === 0) {
                quizContainer.innerHTML = "<p>Failed to load quiz questions.</p>";
                return;
            }

            questions.forEach((question, index) => {
                const questionNumber = index + 1;

                const container = document.createElement("div");
                container.className = "question-container";

                const questionText = document.createElement("p");
                questionText.innerHTML = question.question_text;
                container.appendChild(questionText);

                question.options.forEach(option => {
                    const label = document.createElement("label");
                    label.className = "option-label";

                    const radio = document.createElement("input");
                    radio.type = "radio";
                    radio.name = `answer_${questionNumber}`;
                    radio.value = option.charAt(0);

                    label.appendChild(radio);
                    label.appendChild(document.createTextNode(" " + option));
                    container.appendChild(label);
                });

                const hiddenHash = document.createElement("input");
                hiddenHash.type = "hidden";
                hiddenHash.name = `answer_hash_${questionNumber}`;
                hiddenHash.value = question.answer_hash;
                container.appendChild(hiddenHash);

                quizContainer.appendChild(container);
            });
        }

        form.addEventListener("submit", function(event) {
            const questionContainers = document.querySelectorAll(".question-container");
            let allAnswered = true;

            questionContainers.forEach(container => {
                const radios = container.querySelectorAll("input[type='radio']");
                const checked = Array.from(radios).some(radio => radio.checked);

                if (!checked) {
                    allAnswered = false;
                }
            });

            if (!allAnswered) {
                event.preventDefault();
                alert("Please answer all questions before submitting.");
            }
        });

        renderQuiz();
    </script>

</body>
</html>
